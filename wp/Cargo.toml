[package]
name = "wp"
description = "Unix-style pipelines of WebAssembly components connected by typed streams"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Count host allocations for `--stats` (used by the benchmarks).
stats = ["dep:stats_alloc"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
mimalloc = { version = "0.1.52", features = ["v2"] }
serde_json = "1"
shlex = "1"
stats_alloc = { version = "0.1", optional = true }
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
wasmtime.workspace = true
wasmtime-wasi.workspace = true

[dev-dependencies]
logparse.workspace = true
loggen.workspace = true
