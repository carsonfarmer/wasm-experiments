[alias]
# Build the example tools into target/wasm32-wasip2/release/<name>.wasm, with
# fat LTO (for the tools only, since it makes every host link take minutes).
tools = "build --release --target wasm32-wasip2 --config profile.release.lto=true -p gen -p show -p count -p gen-flat -p count-flat -p parse-log -p errors -p top-paths -p zoo -p zoo-check"
# Run a pipeline with the example tools: cargo wp 'gen 5 | show'
wp = "run --release -q -p wp --"
# Every test, including the end-to-end ones (build the tools first).
test-all = "test --release -p wp -p logparse"

[env]
# Where `cargo wp` and the tests find the example tools.
WP_PATH = { value = "target/wasm32-wasip2/release", relative = true }
# mimalloc commits its arena up front by default: about 6 MiB of memory for
# no speed (bench/PERF.md). The crate has no feature for this.
CFLAGS = "-DMI_DEFAULT_ARENA_EAGER_COMMIT=0"

# The tools may use 128-bit SIMD (memchr does); Wasmtime enables it by default.
[target.wasm32-wasip2]
rustflags = ["-C", "target-feature=+simd128"]
