[workspace]
resolver = "3"
members = ["wp", "tools/*", "bench/loggen", "bench/native"]
exclude = ["tools/zoo-common"]
# `cargo build` builds wp and the benchmark helpers; `cargo tools` builds the
# example tools for wasm32-wasip2 (see .cargo/config.toml).
default-members = ["wp", "bench/loggen", "bench/native"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
authors = ["Carson Farmer <carson.farmer@gmail.com>"]

[workspace.dependencies]
wasmtime = { version = "49.0.3", features = ["wave"] }
wasmtime-wasi = "49.0.3"
wit-bindgen = { version = "0.63.0", features = ["async-spawn"] }
logparse = { path = "tools/logparse" }
loggen = { path = "bench/loggen" }

# `cargo build --profile dist -p wp`: the binary to ship without PGO (see
# bench/pgo.sh). Inlining across crates speeds up Wasmtime's copies between
# components (bench/PERF.md), but links take minutes.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
panic = "abort"

# `cargo build --profile profiling`: release, with symbols for profilers.
[profile.profiling]
inherits = "release"
debug = true

# Wasmtime 49.0.3 with three changes that make stream copies faster, from
# https://github.com/carsonfarmer/wasmtime/tree/wp/v49.0.3-streams (see
# bench/PERF.md, round 3). The WASI crates come from there too, so there's
# one copy of Wasmtime's internals.
[patch.crates-io]
wasmtime = { git = "https://github.com/carsonfarmer/wasmtime", branch = "wp/v49.0.3-streams" }
wasmtime-wasi = { git = "https://github.com/carsonfarmer/wasmtime", branch = "wp/v49.0.3-streams" }
wasmtime-wasi-io = { git = "https://github.com/carsonfarmer/wasmtime", branch = "wp/v49.0.3-streams" }
