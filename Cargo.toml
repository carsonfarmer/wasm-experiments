[workspace]
resolver = "3"
members = ["wp", "tools/*", "bench/loggen", "bench/native"]
exclude = ["tools/zoo-common"]
# `cargo build` builds wp and the benchmark helpers; `cargo tools` builds the
# example tools for wasm32-wasip2 (see .cargo/config.toml).
default-members = ["wp", "bench/loggen", "bench/native"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 WITH LLVM-exception"
authors = ["Carson Farmer <carson.farmer@gmail.com>"]

[workspace.dependencies]
wasmtime = { version = "50.0.0", features = ["wave"] }
wasmtime-wasi = "49.0.3"
wit-bindgen = { version = "0.63.0", features = ["async-spawn"] }
logparse = { path = "tools/logparse" }
loggen = { path = "bench/loggen" }

# `cargo build --profile dist -p wp`: the binary to ship. Inlining across
# crates speeds up Wasmtime's copies between components (bench/PERF.md), but
# links take minutes, and the tools can't use LTO (wit-bindgen links a
# prebuilt object).
[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"

# `cargo build --profile profiling`: release, with symbols for profilers.
[profile.profiling]
inherits = "release"
debug = true
